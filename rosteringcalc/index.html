<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rate calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EEF3F1;
    --panel: #FFFFFF;
    --ink: #1D2B2F;
    --muted: #5B6B6E;
    --line: #CFDAD6;
    --accent: #2F6B5A;
    --accent-soft: #DCEAE4;
    --error: #A33A2B;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141C1E;
      --panel: #1C2629;
      --ink: #E6EEEC;
      --muted: #9FB0B0;
      --line: #33434A;
      --accent: #7CC4AC;
      --accent-soft: #23362F;
      --error: #F08A78;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 1.0625rem;
    line-height: 1.5;
  }
  main {
    max-width: 44rem;
    margin: 0 auto;
    padding: 3rem 1.25rem 4rem;
  }
  h1 {
    font-size: 2rem;
    line-height: 1.15;
    margin: 0 0 0.5rem;
  }
  .intro { color: var(--muted); margin: 0 0 2rem; max-width: 34rem; }

  form {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 1.5rem;
    display: grid;
    gap: 1.25rem;
    grid-template-columns: 1fr 1fr;
  }
  .field { display: grid; gap: 0.35rem; }
  .field.wide { grid-column: 1 / -1; }
  label { font-weight: 700; font-size: 0.95rem; }
  select, input {
    font: inherit;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 0.6rem 0.75rem;
    width: 100%;
  }
  select:focus-visible, input:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 1px;
  }

  .results { margin-top: 2rem; }
  .summary { margin: 0 0 1rem; color: var(--muted); }
  .summary strong { color: var(--ink); }
  table {
    width: 100%;
    border-collapse: collapse;
    font-variant-numeric: tabular-nums;
  }
  th, td {
    text-align: left;
    padding: 0.85rem 0.5rem;
    border-bottom: 1px solid var(--line);
  }
  th { font-size: 0.9rem; color: var(--muted); font-weight: 400; }
  td.num, th.num { text-align: right; }
  td.total {
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--accent);
  }
  .note { display: block; font-size: 0.85rem; font-weight: 400; color: var(--muted); }
  .message {
    padding: 1rem;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--panel);
  }
  .message.error { border-color: var(--error); color: var(--error); }

  @media (max-width: 34rem) {
    form { grid-template-columns: 1fr; }
    main { padding-top: 2rem; }
    td.total { font-size: 1.3rem; }
  }
</style>
</head>
<body>
<main>
  <h1>Rate calculator</h1>
  <p class="intro">Choose a service, the day rate, and how many hours. Each amount is the hourly figure multiplied by the hours you enter.</p>

  <form id="calc" onsubmit="return false">
    <div class="field wide">
      <label for="dataset">Service</label>
      <select id="dataset" disabled><option>Loading…</option></select>
    </div>
    <div class="field">
      <label for="rate">Rate</label>
      <select id="rate" disabled></select>
    </div>
    <div class="field">
      <label for="hours">Hours</label>
      <input id="hours" type="number" inputmode="decimal" min="0" step="0.25" value="1">
    </div>
    <div class="field wide">
      <label for="bonus">Bonus</label>
      <select id="bonus" disabled><option value="">None</option></select>
    </div>
  </form>

  <section class="results" id="results" aria-live="polite"></section>
</main>

<script>
  // ---- Settings ---------------------------------------------------------
  const MANIFEST = "datasets.json";   // list of { name, file } entries
  const BONUS_FILE = "data/bonus.csv"; // bonus name, flat amount
  const BONUS_COLUMN = "take home";    // column the bonus is added to (not case-sensitive)
  const CURRENCY = new Intl.NumberFormat("en-AU", { style: "currency", currency: "AUD" });

  // ---- Elements ---------------------------------------------------------
  const datasetEl = document.getElementById("dataset");
  const rateEl = document.getElementById("rate");
  const hoursEl = document.getElementById("hours");
  const bonusEl = document.getElementById("bonus");
  const resultsEl = document.getElementById("results");

  let current = null; // { headers: [...], rows: [[...], ...] }
  const cache = {};

  // ---- CSV parsing (handles quotes, CRLF, stray spaces) -----------------
  function parseCSV(text) {
    const rows = [];
    let row = [], cell = "", inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
        else if (c === '"') inQuotes = false;
        else cell += c;
      } else if (c === '"') inQuotes = true;
      else if (c === ",") { row.push(cell.trim()); cell = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(cell.trim()); rows.push(row); row = []; cell = "";
      } else cell += c;
    }
    if (cell !== "" || row.length) { row.push(cell.trim()); rows.push(row); }
    return rows.filter(r => r.some(v => v !== ""));
  }

  // "$1,050.00 " -> 1050
  function toNumber(value) {
    const cleaned = String(value).replace(/[$,\s]/g, "");
    if (cleaned === "") return null;
    const n = Number(cleaned);
    return Number.isFinite(n) ? n : null;
  }

  // ---- UI ---------------------------------------------------------------
  function showMessage(text, isError) {
    resultsEl.innerHTML = "";
    const p = document.createElement("p");
    p.className = "message" + (isError ? " error" : "");
    p.textContent = text;
    resultsEl.appendChild(p);
  }

  function render() {
    if (!current) return;
    const row = current.rows[rateEl.value];
    const hours = parseFloat(hoursEl.value);
    if (!row) return;
    if (!Number.isFinite(hours) || hours < 0) {
      showMessage("Enter the number of hours as 0 or more, for example 2.5.", true);
      return;
    }

    resultsEl.innerHTML = "";
    const summary = document.createElement("p");
    summary.className = "summary";
    summary.innerHTML = `<strong></strong> at <strong></strong> for <strong></strong>`;
    const [s1, s2, s3] = summary.querySelectorAll("strong");
    s1.textContent = datasetEl.options[datasetEl.selectedIndex].text;
    s2.textContent = row[0];
    s3.textContent = hours === 1 ? "1 hour" : `${hours} hours`;
    const bonusAmount = bonusEl.value === "" ? 0 : Number(bonusEl.value);
    const bonusName = bonusEl.options[bonusEl.selectedIndex]?.text;
    if (bonusAmount) {
      summary.append(", plus ");
      const s4 = document.createElement("strong");
      s4.textContent = `${bonusName} bonus`;
      summary.appendChild(s4);
    }
    resultsEl.appendChild(summary);

    const table = document.createElement("table");
    table.innerHTML = `<thead><tr><th scope="col">Item</th><th scope="col" class="num">Per hour</th><th scope="col" class="num">Total</th></tr></thead><tbody></tbody>`;
    const tbody = table.querySelector("tbody");

    current.headers.slice(1).forEach((header, i) => {
      const raw = row[i + 1] ?? "";
      const perHour = toNumber(raw);
      const tr = document.createElement("tr");
      const name = document.createElement("td");
      const rate = document.createElement("td");
      const total = document.createElement("td");
      name.textContent = header;
      rate.className = "num";
      total.className = "num total";
      if (perHour === null) {
        rate.textContent = raw || "–";
        total.textContent = "–";
      } else {
        rate.textContent = CURRENCY.format(perHour);
        const isBonusColumn = header.trim().toLowerCase() === BONUS_COLUMN;
        const bonus = isBonusColumn ? bonusAmount : 0;
        total.textContent = CURRENCY.format(perHour * hours + bonus);
        if (bonus) {
          const note = document.createElement("span");
          note.className = "note";
          note.textContent = `includes ${CURRENCY.format(bonus)} bonus`;
          total.appendChild(note);
        }
      }
      tr.append(name, rate, total);
      tbody.appendChild(tr);
    });

    resultsEl.appendChild(table);
  }

  async function loadDataset(file) {
    rateEl.disabled = true;
    try {
      if (!cache[file]) {
        const res = await fetch(file, { cache: "no-cache" });
        if (!res.ok) throw new Error(`${file} returned ${res.status}`);
        const rows = parseCSV(await res.text());
        if (rows.length < 2) throw new Error(`${file} has no data rows`);
        cache[file] = { headers: rows[0], rows: rows.slice(1) };
      }
      current = cache[file];
      const previous = rateEl.options[rateEl.selectedIndex]?.text;
      rateEl.innerHTML = "";
      current.rows.forEach((r, i) => rateEl.add(new Option(r[0], i)));
      const match = [...rateEl.options].find(o => o.text === previous);
      if (match) rateEl.value = match.value;
      rateEl.disabled = false;
      render();
    } catch (err) {
      current = null;
      showMessage(`Couldn't load this service's rates (${err.message}). Check the file path in ${MANIFEST}.`, true);
    }
  }

  async function loadBonuses() {
    try {
      const res = await fetch(BONUS_FILE, { cache: "no-cache" });
      if (!res.ok) throw new Error(`${BONUS_FILE} returned ${res.status}`);
      parseCSV(await res.text()).slice(1).forEach(([name, amount]) => {
        const n = toNumber(amount);
        if (name && n !== null) bonusEl.add(new Option(name, n));
      });
      bonusEl.disabled = false;
    } catch (err) {
      bonusEl.options[0].text = "None (bonuses unavailable)";
      console.warn(err);
    }
  }

  async function init() {
    loadBonuses();
    try {
      const res = await fetch(MANIFEST, { cache: "no-cache" });
      if (!res.ok) throw new Error(`${MANIFEST} returned ${res.status}`);
      const datasets = await res.json();
      datasetEl.innerHTML = "";
      datasets.forEach(d => datasetEl.add(new Option(d.name, d.file)));
      datasetEl.disabled = false;
      await loadDataset(datasetEl.value);
    } catch (err) {
      datasetEl.innerHTML = "<option>Unavailable</option>";
      showMessage(`Couldn't load the list of services (${err.message}). If you opened this file directly from your computer, run it from GitHub Pages or a local web server instead.`, true);
    }
  }

  datasetEl.addEventListener("change", () => loadDataset(datasetEl.value));
  rateEl.addEventListener("change", render);
  hoursEl.addEventListener("input", render);
  bonusEl.addEventListener("change", render);
  init();
</script>
</body>
</html>
